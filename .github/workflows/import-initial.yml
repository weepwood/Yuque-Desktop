name: Import initial Electron sources
on:
  push:
    branches: [main]
    paths: [bootstrap/source.b64]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract initial source bundle
        run: |
          python3 - <<'PY'
          import base64, pathlib, tarfile, io
          payload = pathlib.Path('bootstrap/source.b64')
          binary = base64.b64decode(payload.read_text().strip(), validate=True)
          with tarfile.open(fileobj=io.BytesIO(binary), mode='r:xz') as bundle:
              destination = pathlib.Path.cwd()
              for member in bundle.getmembers():
                  path = destination / member.name
                  if not path.resolve().is_relative_to(destination):
                      raise ValueError('Archive escapes repository: '+ member.name)
                  if not member.isfile():
                      raise ValueError('Unexpected archive entry')
              bundle.extractall(destination, filter='data')
          PY
      - name: Commit imported source
        run: |
          rm -rf bootstrap .github/workflows/import-initial.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 导入 Electron 语雀桌面客户端 v0.1.0"
          git push origin HEAD:main
